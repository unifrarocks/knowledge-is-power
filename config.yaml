# =============================================================================
# Daily brief config. Edit group_ids and tickers; everything else is optional.
# =============================================================================

# How recent a 知识星球 post must be to appear in the summary, in hours.
zsxq_lookback_hours: 24

# Stock-mover threshold (absolute % change vs prior close).
stock_threshold_pct: 2.0

# Claude model used for summaries and central-bank web search.
# Cheaper alternative for summaries: claude-haiku-4-5
claude_model: "claude-sonnet-4-6"

# -----------------------------------------------------------------------------
# 知识星球
# -----------------------------------------------------------------------------
# Get group_id from the URL when you click into a planet on wx.zsxq.com:
#   https://wx.zsxq.com/group/{GROUP_ID}    <-- this number
# Or from devtools Network → topics?... → groups/{GROUP_ID}/topics
planets:
  - name: "跨市场资产策略笔记"
    group_id: "REPLACE_ME"
    prompt_style: "financial"
  - name: "C&X Research"
    group_id: "REPLACE_ME"
    prompt_style: "financial"
  - name: "全球特讯 | 兔主席的宝藏"
    group_id: "REPLACE_ME"
    prompt_style: "geopolitical"
  - name: "报告研究所"
    group_id: "REPLACE_ME"
    prompt_style: "research"

